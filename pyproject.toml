[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "LineDream"
version = "0.3.15"
description = "A generative art library"
authors = [{ name = "Marc Leonard", email = "marc.r.leonard@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "drawSvg[all] ~=2.4.0",
    "numpy >=1.24.0",
    "lxml >=4.9.3",  # only for the experimental, unexported TextLine (primitives/hershey)
    "pillow >=10.4.0",
]

[project.optional-dependencies]
# kept as an extra (not a dependency group) because Cloudflare Pages installs it with pip: requirements.txt -> .[docs]
docs = [
    "pdoc ==8.0.1",
    "Jinja2 ==3.1.6",
    "beautifulsoup4 >=4.12",
]

[dependency-groups]
dev = [
    "pytest >=8",
    "coverage >=7",
]

[project.urls]
Homepage = "https://linedream.marcrleonard.com"
Documentation = "https://linedream.marcrleonard.com/documentation/"
Repository = "https://github.com/marcrleonard/LineDream"

[tool.setuptools.packages.find]
where = ["."]
include = ["LineDream*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
LineDream = ["fonts/*.json", "fonts/LICENSE"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
